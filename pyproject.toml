[project]
name = "airwise"
version = "0.1.0"
description = "Air quality comparison built on the Open-Meteo Air Quality API"
requires-python = ">=3.14"
dependencies = [
  "fastapi==0.142.2",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  # IANA time zones on platforms without a system database (Windows, minimal images).
  "tzdata==2026.5",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "respx==0.23.1",
  "ruff==0.16.10",
  "mypy==2.4.0",
  "pip-audit==2.10.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airwise"]

[tool.uv]
package = true

[tool.ruff]
line-length = 110
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PTH"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PTH"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
packages = ["airwise"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:airwise.*"]
